[package]
name = "minigraf-swift-shim"
version = "0.0.0"
edition = "2024"
publish = false
description = "Swift/iOS binding for Minigraf — bi-temporal graph database"
license = "MIT OR Apache-2.0"

[lib]
name = "minigraf_ffi"
crate-type = ["staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/uniffi_bindgen.rs"

[dependencies]
# Pin to the exact released version. The release workflow updates this line.
# Unreleased v3 core (format v8). Switches to minigraf = "=3.0.0" at the v3.0.0 release.
minigraf = { git = "https://github.com/project-minigraf/minigraf", rev = "97cd4a2a85301ea3478250dd654139d45a1f7cd0" }
uniffi = { version = "0.31.1", features = ["cli"] }
thiserror = "2.0.18"
serde_json = "1.0.149"

[workspace]
members = ["."]
