name: Swift Release

on:
  repository_dispatch:
    types: [core-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.2.0)'
        required: true

permissions:
  contents: write

jobs:
  prepare:
    name: Pin version, commit, tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      semver: ${{ steps.ver.outputs.semver }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.MINIGRAF_RELEASE_TOKEN }}

      - id: ver
        env:
          V: ${{ github.event.client_payload.version || github.event.inputs.version }}
        run: |
          [[ "$V" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version '$V' is not v<semver>"; exit 1; }
          echo "tag=$V" >> "$GITHUB_OUTPUT"
          echo "semver=${V#v}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - name: Wait for minigraf ${{ steps.ver.outputs.semver }} on crates.io
        run: |
          SEMVER="${{ steps.ver.outputs.semver }}"
          echo "Waiting for minigraf@$SEMVER on crates.io..."
          for i in $(seq 1 20); do
            STATUS=$(curl -s "https://crates.io/api/v1/crates/minigraf/$SEMVER" \
              -H "User-Agent: minigraf-binding/1.0" | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(d.get('version',{}).get('num',''))" 2>/dev/null || echo "")
            if [ "$STATUS" = "$SEMVER" ]; then
              echo "minigraf@$SEMVER is live (attempt $i)"
              exit 0
            fi
            echo "Attempt $i/20: not yet available, waiting 15s..."
            sleep 15
          done
          echo "ERROR: minigraf@$SEMVER not found on crates.io after 5 minutes" >&2
          exit 1
      - name: Pin minigraf version in Cargo.toml
        run: |
          sed -i 's/^minigraf = "=[^"]*"/minigraf = "=${{ steps.ver.outputs.semver }}"/' Cargo.toml

      - name: Update Cargo.lock
        run: cargo update --precise "${{ steps.ver.outputs.semver }}" minigraf

      - name: Stamp the version in the README install snippet
        run: |
          sed -i 's|\(\.package(url: "https://github.com/project-minigraf/minigraf-swift", from: "\)[^"]*"|\1${{ steps.ver.outputs.semver }}"|' README.md
          [ "$(grep -c 'minigraf-swift", from: "${{ steps.ver.outputs.semver }}")' README.md)" -eq 1 ] \
            || { echo "::error::the README install snippet was not stamped"; exit 1; }

      # Push the pin commit to a throwaway branch only. The tag and main are
      # updated by the tag job, after the test job has passed on this commit.
      - name: Commit and push release branch
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: release ${{ steps.ver.outputs.tag }}"
          else
            echo "Cargo.toml already pinned, skipping commit"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push --force origin "HEAD:refs/heads/release/${{ steps.ver.outputs.tag }}"

  # Run this binding's test suite against the exact pinned core version before
  # anything becomes visible: no tag, no main update, no publish until it passes.
  test:
    name: Test pinned release
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      # The xcframework is built and consumer-tested here at the release
      # version; publish uploads exactly this zip and these Swift sources.
      version: ${{ needs.prepare.outputs.semver }}

  # The source commit gets a non-semver `source-vX` tag. The semver `vX` tag is
  # what Swift Package Manager resolves, so it goes on the swift-releases commit
  # that carries the real xcframework URL, checksum and generated Swift sources
  # (build-and-publish below). A semver tag on the source commit resolves to a
  # manifest with a placeholder checksum and no Swift sources.
  tag:
    name: Push source tag and update main
    needs: [prepare, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          token: ${{ secrets.MINIGRAF_RELEASE_TOKEN }}
          # Parent commit (= main) so git can verify the main push is a fast-forward.
          fetch-depth: 2

      - name: Push source tag, fast-forward main, delete release branch
        env:
          TAG: source-${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          EXISTING=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          if [ -z "$EXISTING" ]; then
            REFS=("$SHA:refs/heads/main" "$SHA:refs/tags/$TAG")
          elif [ "$EXISTING" = "$SHA" ]; then
            echo "Tag $TAG already points at $SHA, skipping tag push"
            REFS=("$SHA:refs/heads/main")
          else
            echo "::error::Tag $TAG already exists at $EXISTING, but the tested commit is $SHA. Delete the tag and re-run to release the tested commit."
            exit 1
          fi
          # Atomic: main and the tag move together or not at all. Rejected if
          # main moved during the release; re-run to re-pin on the new main.
          git push --atomic origin "${REFS[@]}"
          git push origin --delete "release/${{ needs.prepare.outputs.tag }}" \
            || echo "::warning::Could not delete branch release/${{ needs.prepare.outputs.tag }}"

  publish:
    name: Publish the tested xcframework
    needs: [prepare, test, tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source-${{ needs.prepare.outputs.tag }}
          token: ${{ secrets.MINIGRAF_RELEASE_TOKEN }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: dist-xcframework
          path: ${{ runner.temp }}/dist

      # A re-run after a partial publish must not move what is already public:
      # once the semver tag exists, its Package.swift fixes the checksum, so
      # only the same zip may be uploaded, and the branch and tag stay put.
      - name: Check for an earlier publish of this version
        id: earlier
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          DIST: ${{ runner.temp }}/dist
        run: |
          ZIP="$DIST/MinigrafKit-${TAG}.xcframework.zip"
          [ -f "$ZIP" ] || { echo "::error::no $ZIP"; ls -R "$DIST"; exit 1; }
          CHECKSUM=$(sha256sum "$ZIP" | awk '{print $1}')
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            git fetch --quiet origin "refs/tags/$TAG:refs/tags/$TAG"
            PUBLISHED=$(git show "$TAG:Package.swift" | sed -n 's/.*checksum: "\([0-9a-f]*\)".*/\1/p')
            if [ "$PUBLISHED" != "$CHECKSUM" ]; then
              echo "::error::$TAG is already tagged with checksum $PUBLISHED, but the tested zip is $CHECKSUM. The tag is public; do not move it."
              exit 1
            fi
            echo "::warning::$TAG is already tagged with this zip's checksum; only the release asset is (re)checked"
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute checksum and update Package.swift
        if: steps.earlier.outputs.tagged == 'false'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          CHECKSUM: ${{ steps.earlier.outputs.checksum }}
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/MinigrafKit-${TAG}.xcframework.zip"
          perl -0pi -e "s|url: \"[^\"]*\",(\s*)checksum: \"[^\"]*\"|url: \"${URL}\",\1checksum: \"${CHECKSUM}\"|" Package.swift
          grep -q "checksum: \"${CHECKSUM}\"" Package.swift || { echo "::error::Package.swift was not updated"; exit 1; }
          grep -n 'url:\|checksum:' Package.swift

      - name: Commit Package.swift and Swift sources to swift-releases branch
        if: steps.earlier.outputs.tagged == 'false'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          DIST: ${{ runner.temp }}/dist
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          TMPDIR_SWIFT=$(mktemp -d)
          cp Package.swift "$TMPDIR_SWIFT/Package.swift"
          cp -R Sources/MinigrafKit/. "$TMPDIR_SWIFT/MinigrafKit"
          rm -f "$TMPDIR_SWIFT/MinigrafKit/.gitkeep"
          cp "$DIST"/Sources/*.swift "$TMPDIR_SWIFT/MinigrafKit/"

          if git fetch origin swift-releases 2>/dev/null; then
            git checkout -fB swift-releases origin/swift-releases
          else
            git checkout --orphan swift-releases
            git rm -rf . --quiet 2>/dev/null || true
          fi

          # Replace the target's files outright, so a header or module map
          # committed by an older release does not linger.
          git rm -rq --ignore-unmatch Sources/MinigrafKit
          rm -rf Sources/MinigrafKit
          cp "$TMPDIR_SWIFT/Package.swift" Package.swift
          mkdir -p Sources/MinigrafKit/
          cp -R "$TMPDIR_SWIFT/MinigrafKit/." Sources/MinigrafKit/
          rm -rf "$TMPDIR_SWIFT"

          git add Package.swift Sources/MinigrafKit/
          git commit -m "chore(release): update Package.swift and Swift bindings for ${TAG}" \
            || echo "Nothing to commit"
          git push origin swift-releases --force

          NEW_SHA=$(git rev-parse HEAD)
          echo "SWIFT_SHA=$NEW_SHA" >> "$GITHUB_ENV"

      # SPM resolves semver tags only, so the semver tag must point at the
      # swift-releases commit whose Package.swift has the real URL and checksum.
      - name: Tag the swift-releases commit with the semver tag
        if: steps.earlier.outputs.tagged == 'false'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          EXISTING=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          if [ -z "$EXISTING" ]; then
            git push origin "$SWIFT_SHA:refs/tags/$TAG"
          elif [ "$EXISTING" = "$SWIFT_SHA" ]; then
            echo "Tag $TAG already points at $SWIFT_SHA"
          else
            echo "::error::Tag $TAG already exists at $EXISTING, not at the swift-releases commit $SWIFT_SHA. Check which commit SPM users resolve before moving it."
            exit 1
          fi

      - name: Create GitHub Release and upload xcframework
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          DIST: ${{ runner.temp }}/dist
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "MinigrafKit $TAG" \
              --notes "Swift/iOS binding for minigraf $TAG."
          fi
          # The zip matches the tagged checksum (checked above), so replacing an
          # asset left by a partial upload is safe.
          gh release upload "$TAG" "$DIST/MinigrafKit-${TAG}.xcframework.zip" \
            --repo "$GITHUB_REPOSITORY" --clobber

  # Resolves the published version with SPM and runs the consumer test on an
  # iOS simulator; on failure the run fails and a release-broken issue is opened.
  verify-published:
    name: Verify the published package
    needs: [prepare, publish]
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/verify-published.yml
    with:
      version: ${{ needs.prepare.outputs.semver }}
      ref: source-${{ needs.prepare.outputs.tag }}
